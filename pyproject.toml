[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cpu-kitchen"
version = "0.1.0"
description = "Jogo educacional sobre escalonamento de CPU (FCFS e Round Robin)"
requires-python = ">=3.13"
dependencies = [
    "streamlit",
]

[tool.setuptools.packages.find]
where = ["src"]